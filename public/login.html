<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — Unveil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f; color: #e8e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #13131f; border: 1px solid #222235;
      border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo svg { width: 30px; height: 30px; }
    .logo h1 {
      font-size: 1.8rem; font-weight: 700;
      background: linear-gradient(135deg, #c8f135, #8ee000);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px;
      background: #0d0d18; border: 1px solid #2a2a40;
      border-radius: 10px; color: #e8e8f0; font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #c8f135; }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #c8f135, #8ee000);
      border: none; border-radius: 10px;
      color: #0a0a0f; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .err {
      background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.3);
      border-radius: 8px; padding: 11px 14px;
      color: #ff6b6b; font-size: 0.88rem; margin-bottom: 16px; display: none;
    }
    .links { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #666; }
    .links a { color: #c8f135; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .divider { border-top: 1px solid #1e1e35; margin: 20px 0; }
    .back { display: flex; align-items: center; gap: 6px; color: #666; font-size: 0.85rem; text-decoration: none; margin-bottom: 20px; }
    .back:hover { color: #aaa; }
  </style>
</head>
<body>
<div class="card">
  <a href="/" class="back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    돌아가기
  </a>

  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="17" stroke="#c8f135" stroke-width="2"/>
      <ellipse cx="18" cy="18" rx="8" ry="5" stroke="#c8f135" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="3" fill="#c8f135"/>
    </svg>
    <h1>Unveil</h1>
  </div>

  <h2>로그인</h2>
  <p class="sub">내 얼굴 모니터링 서비스에 접속하세요</p>

  <div class="err" id="err"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn" id="submitBtn">로그인</button>
  </form>

  <div class="divider"></div>
  <div class="links">
    아직 계정이 없으신가요? <a href="/register.html">회원가입</a>
  </div>
</div>

<script>
  // 이미 로그인된 경우 대시보드로
  const token = localStorage.getItem('unveil_token');
  if (token) window.location.href = '/dashboard.html';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('err');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = '로그인 중...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        err.textContent = data.error || '로그인 실패';
        err.style.display = 'block';
      } else {
        localStorage.setItem('unveil_token', data.token);
        localStorage.setItem('unveil_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      }
    } catch(e) {
      err.textContent = '서버 연결 실패. 서버가 실행 중인지 확인해주세요.';
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '로그인';
    }
  });
</script>
</body>
</html>
